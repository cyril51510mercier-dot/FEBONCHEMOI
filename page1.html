<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fébonchémoi - Tableau de Bord Global</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Fébonchémoi - Suivi de l'Habitat</h1>

    <div class="section">
        <h2>🌍 Environnement Extérieur</h2>
        <div>
            <label for="location">Ville (Manuelle ou Automatique) :</label>
            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <input type="text" id="location" placeholder="Ex: Reims" style="flex-grow: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
                <button id="getWeatherButton" style="padding: 10px 15px; border-radius: 4px; border: 1px solid #ccc; cursor: pointer;">🔍 Chercher</button> 
                <button id="geoLocateButton" style="background-color: #3498db; color: white; border: none; border-radius: 4px; padding: 10px 15px; cursor: pointer; font-weight: bold;">📍 Me localiser</button>
            </div>
        </div>
    </div>

    <div class="section">
        <h2>👕 Votre isolation (Globale)</h2>
        <div id="cloVisualizer">
            Isolation actuelle : <span id="currentCloValue">1.0</span> Clo 
            <br><small id="cloTypeText">Tenue normale</small>
            <br><br>
            <button onclick="adjustClothing(-0.2)">👕 Enlever une couche</button>
            <button onclick="adjustClothing(0.2)">🧥 Ajouter une couche</button>
            <button onclick="resetClothing()">Réinitialiser</button>
        </div>
    </div>

    <div class="section" style="background-color: #f8f9fa; border-top: 5px solid #8e44ad;">
        <h2 style="margin-top: 0;">🎛️ Radiographie de l'Habitat</h2>
        <p style="font-size: 0.9em; color: #666; margin-bottom: 20px;">
            Vue d'ensemble du confort thermique et de la qualité de l'air.
        </p>

        <button id="btn-sync-all" onclick="synchroniserTouteLaMaison()" style="width: 100%; padding: 15px; font-size: 1.1em; background-color: #8e44ad; color: white; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 20px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            ⚡ Actualiser toutes les pièces
        </button>

        <div id="dashboard-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;">
            </div>
    </div>

    <center style="margin-top: 30px; margin-bottom: 20px;">
        <a href="setup.html" style="color: #95a5a6; text-decoration: none; font-size: 0.9em;">⚙️ Accès Expert (Paramétrage des zones)</a>
    </center>

    <script src="script.js" defer></script>
</body>
</html>
