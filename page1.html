<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solstice - Tableau de Bord</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>☀️ SOLSTICE</h1>
    <p class="subtitle">Suivi de l'Habitat</p>

    <div class="section">
        <h2>🌍 Environnement Extérieur</h2>
        <div>
            <label for="location">Ville (Manuelle ou Automatique) :</label>
            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <input type="text" id="location" placeholder="Ex: Reims" style="flex-grow: 1; margin-bottom: 0;">
                <button id="getWeatherButton">🔍</button> 
                <button id="geoLocateButton">📍 Localiser</button>
            </div>
        </div>
    </div>

    <div class="section">
        <h2>👕 Votre isolation corporelle (Clo)</h2>
        <div id="cloVisualizer">
            Isolation actuelle : <span id="currentCloValue" style="font-weight:bold; color:var(--secondary);">1.0</span> Clo 
            <br><br>
            <button onclick="adjustClothing(-0.2)">👕 Enlever une couche</button>
            <button onclick="adjustClothing(0.2)">🧥 Ajouter une couche</button>
            <button onclick="resetClothing()">Réinitialiser</button>
        </div>
    </div>

    <div class="section" style="border-top: 5px solid var(--primary);">
        <h2 style="margin-top: 0;">🎛️ Radiographie de l'Habitat</h2>
        
        <button id="btn-sync-all" onclick="synchroniserTouteLaMaison()">
            ⚡ Interroger les capteurs (Super-Scan)
        </button>

        <div id="dashboard-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;">
        </div>
    </div>

    <center style="margin-top: 30px; margin-bottom: 20px;">
        <a href="setup.html" style="color: #95a5a6; font-size: 0.9em;">⚙️ Accès Professionnel (Paramétrage BEM)</a>
    </center>

    <script src="script.js" defer></script>
</body>
</html>
