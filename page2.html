<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solstice - Plan d'Action & Recommandations</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --primary: #2563eb;
            --eco: #16a34a;
            --hot: #ea580c;
            --cold: #0284c7;
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-muted: #64748b;
        }

        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 2rem; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; }

        .dashboard-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; background: var(--card); padding: 1rem 1.5rem; border-radius: 10px; border: 1px solid var(--border); }
        .filter-group { display: flex; align-items: center; gap: 0.75rem; }
        select { padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid var(--border); font-size: 0.95rem; font-weight: 600; }

        /* Jauge de score & PMV de la pièce */
        .feedback-panel { background: var(--card); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 2rem; }
        .gauge-header { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 0.5rem; }
        .progress-bg { width: 100%; height: 14px; background: #e2e8f0; border-radius: 7px; overflow: hidden; margin-bottom: 1rem; }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), var(--eco)); transition: width 0.3s ease; }
        .pmv-status { display: flex; gap: 2rem; font-size: 0.95rem; color: var(--text-muted); }
        .pmv-highlight { font-weight: 800; font-size: 1.1rem; }

        /* Titles & Containers */
        .section-title { font-size: 1.15rem; font-weight: 700; margin: 1.75rem 0 0.85rem 0; display: flex; align-items: center; gap: 0.5rem; }
        .reco-group { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem; }

        /* Section Actions Effectuées */
        .completed-section {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 1.25rem;
            border-radius: 12px;
            margin-top: 2.5rem;
        }
        .completed-section .section-title { color: var(--eco); margin-top: 0; }

        /* Cards Design avec pièce mise en valeur */
        .reco-card { display: flex; align-items: flex-start; gap: 1rem; background: var(--card); padding: 1.25rem; border-radius: 8px; border: 1px solid var(--border); transition: all 0.2s ease; cursor: pointer; }
        .reco-card:hover { border-color: var(--primary); transform: translateY(-1px); }
        .reco-card.checked { background: #ffffff; border-color: #86efac; opacity: 0.9; }
        
        .checkbox-box { margin-top: 0.25rem; }
        .checkbox-box input { width: 22px; height: 22px; accent-color: var(--eco); cursor: pointer; }

        .reco-body { flex: 1; }
        .reco-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
        
        /* Badge Pièce TrÈs Visuel */
        .room-badge-bold { 
            font-size: 0.82rem; 
            background: #1e293b; 
            color: #ffffff; 
            padding: 0.25rem 0.65rem; 
            border-radius: 6px; 
            font-weight: 700; 
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }
        
        .reco-title { font-weight: 700; font-size: 1.02rem; color: var(--text); }
        .reco-card.checked .reco-title { text-decoration: line-through; color: var(--text-muted); }
        .reco-text { font-size: 0.92rem; color: var(--text-muted); line-height: 1.45; }
        
        .reco-meta { display: flex; gap: 0.5rem; margin-top: 0.65rem; }
        .tag { font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 4px; font-weight: 700; }
        .tag-weight { background: #dcfce7; color: var(--eco); }

        .type-air { border-left: 5px solid #06b6d4; }
        .type-cool { border-left: 5px solid var(--cold); }
        .type-sun { border-left: 5px solid #f59e0b; }
        .type-heat { border-left: 5px solid var(--hot); }
        .type-eco { border-left: 5px solid var(--eco); }

        .btn-secondary { display: inline-block; padding: 0.6rem 1.2rem; background: #e2e8f0; color: var(--text); border-radius: 6px; text-decoration: none; font-weight: 600; }
        .btn-secondary:hover { background: #cbd5e1; }
    </style>
</head>
<body>

<div class="container">

    <!-- En-tête de page & Sélecteur -->
    <header class="dashboard-bar">
        <div>
            <h1 style="font-size: 1.3rem; margin: 0;">Plan d'Action Thermique</h1>
            <p style="margin: 0.2rem 0 0 0; font-size: 0.85rem; color: var(--text-muted);">Recommandations Solstice sur-mesure</p>
        </div>
        <div class="filter-group">
            <label for="zoneSelect"><strong>Pièce analysée :</strong></label>
            <select id="zoneSelect"></select>
        </div>
    </header>

    <!-- Feedback PMV & Eco-Score dédié à la pièce -->
    <section class="feedback-panel">
        <div class="gauge-header">
            <span id="roomScoreTitle">Score d'Éco-Performance de la pièce</span>
            <span id="scoreVal">0 / 100 pts</span>
        </div>
        <div class="progress-bg">
            <div id="scoreBar" class="progress-fill"></div>
        </div>
        <div class="pmv-status">
            <span>PMV Actuel : <strong id="disp-pmv-init" class="pmv-highlight">--</strong></span>
            <span>PMV Simulé (après actions) : <strong id="disp-pmv-sim" class="pmv-highlight">--</strong></span>
        </div>
    </section>

    <!-- Listes d'Actions à Réaliser -->
    <section>
        <h2 class="section-title">⚡ Actions Immédiates (Court terme)</h2>
        <div id="container-immediate" class="reco-group"></div>
    </section>

    <section>
        <h2 class="section-title">⏳ Actions Anticipées (Inertie & Anticipation)</h2>
        <div id="container-anticipated" class="reco-group"></div>
    </section>

    <!-- Zone dédiée aux Actions Effectuées -->
    <section class="completed-section">
        <h2 class="section-title">✅ Actions Effectuées</h2>
        <div id="container-completed" class="reco-group"></div>
    </section>

    <footer style="margin-top: 40px; text-align: center; margin-bottom: 30px;">
        <a href="page1.html" class="btn-secondary">← Retour au Tableau de Bord</a>
    </footer>

</div>

<script src="script.js"></script>
<script src="page2_script.js"></script>
</body>
</html>
