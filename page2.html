<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solstice - Plan d'Action & Recommandations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        
        <!-- Barre de commande & Sélecteur de pièce -->
        <header class="dashboard-bar">
            <div>
                <h1>📊 Plan d'Action & Recommandations</h1>
                <p class="subtitle">Intelligence Artificielle Thermique Solstice</p>
            </div>
            <div class="filter-group">
                <label for="zoneSelect"><strong>Filtrer par pièce :</strong></label>
                <select id="zoneSelect">
                    <!-- Injecté dynamiquement par page2_script.js -->
                </select>
            </div>
        </header>

        <!-- Panneau de Feedback & Simulation PMV ISO 7730 -->
        <section class="feedback-panel">
            <div class="gauge-header">
                <span>Score d'Éco-Performance</span>
                <span id="scoreVal">0 / 100 pts</span>
            </div>
            <div class="progress-bg">
                <div id="scoreBar" class="progress-fill"></div>
            </div>
            <div class="pmv-status">
                <span>PMV Mesuré : <strong id="disp-pmv-init">--</strong></span>
                <span>PMV Simulé (après actions) : <strong id="disp-pmv-sim">--</strong></span>
            </div>
        </section>

        <!-- Liste des Actions Immédiates (Court terme) -->
        <section class="reco-section">
            <h2 class="section-title">⚡ Actions Immédiates (Court terme)</h2>
            <div id="container-immediate" class="reco-group">
                <!-- Injecté dynamiquement -->
            </div>
        </section>

        <!-- Liste des Actions Anticipées (Inertie & Anticipation) -->
        <section class="reco-section">
            <h2 class="section-title">⏳ Actions Anticipées (Moyen terme / Inertie)</h2>
            <div id="container-anticipated" class="reco-group">
                <!-- Injecté dynamiquement -->
            </div>
        </section>

        <!-- Navigation -->
        <footer style="margin-top: 40px; text-align: center; margin-bottom: 30px;">
            <a href="page1.html" class="btn-secondary">← Retour au Tableau de Bord</a>
        </footer>

    </div>

    <!-- ⚠️ RÈGLE CRITIQUE : script.js doit être chargé EN PREMIER pour exposer SolsticeEngine -->
    <script src="script.js"></script>
    <script src="page2_script.js"></script>
</body>
</html>
