<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solstice — Connexion</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background: #0F172A; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;">

    <div style="background: white; padding: 30px; border-radius: 12px; width: 100%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);">
        <h2 style="text-align: center; margin-bottom: 8px;">☀️ SOLSTICE</h2>
        <p style="text-align: center; color: #64748B; font-size: 0.85rem; margin-top: 0;">Diagnostic & Suivi Thera-Aéraulique</p>

        <form id="login-form" style="display: flex; flex-direction: column; gap: 14px; margin-top: 20px;">
            <div>
                <label for="email">Adresse Email</label>
                <input type="email" id="email" required placeholder="nom@exemple.fr">
            </div>
            <div>
                <label for="password">Mot de passe</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" id="btn-submit" class="btn-primary" style="padding: 12px; font-size: 1rem; margin-top: 10px;">
                Se connecter
            </button>
        </form>
        <div id="error-msg" style="color: #EF4444; font-size: 0.85rem; margin-top: 12px; text-align: center; display: none;"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://hgmvwaehgedudklftltb.supabase.co';
        const SUPABASE_ANON_KEY = 'TA_CLE_ANON_SUPABASE';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error-msg');
            const btn = document.getElementById('btn-submit');

            btn.textContent = "Connexion...";
            errorEl.style.display = 'none';

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                errorEl.textContent = "Identifiants incorrects.";
                errorEl.style.display = 'block';
                btn.textContent = "Se connecter";
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
